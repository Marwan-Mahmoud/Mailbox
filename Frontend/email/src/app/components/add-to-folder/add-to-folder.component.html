<p-toast position="bottom-right"></p-toast>

<p-dialog
	header="Select Folder"
	[(visible)]="show"
	[draggable]="false"
	styleClass="w-96 h-4/5 folder-dialog"
>
	<div class="flex flex-col h-full text-slate-900 text-opacity-90">
		<div class="flex-grow min-h-0 overflow-y-auto divide-y divide-[var(--gray-100)] py-0.5">
			<div *ngIf="creating" class="py-2 px-4">
				<input
					type="text" class="w-full py-0.5 px-2"
					#renameInput
					(blur)="createEnd()" (keyup.enter)="createEnd()"
					(keydown.escape)="cancelCreate(); $event.stopPropagation()"
					[(ngModel)]="newFolderName"
				/>
			</div>

			<div
				*ngFor="let folder of folders"
				class="row"
				(click)="selectFolder(folder)"
			>
				{{ folder.name }}
			</div>
		</div>

		<div class="h-10 mb-2 mt-5 px-6 w-full shrink-0">
			<button
                pButton pRipple
                class="p-button-outlined p-button-secondary p-button-sm"
                label="New Folder"
                (click)="createMode()"
			></button>
		</div>
	</div>
</p-dialog>

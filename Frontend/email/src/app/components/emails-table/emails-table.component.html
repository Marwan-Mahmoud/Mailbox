<p-toast position="bottom-right" key="success"></p-toast>
<p-toast position="top-center" key="error"></p-toast>

<div class="w-full h-full relative">
    <p-table
    [value]="page?.content || []"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [paginator]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}-{last} of {totalRecords}"
    [scrollable]="true"
    scrollHeight="calc(100vh - 8.75rem)"
    [lazy]="true"
    (onLazyLoad)="lazyLoadData($event)"
    [totalRecords]="page?.page?.totalElements || 0"
    selectionMode="multiple"
    [(selection)]="selectedEmails"
    dataKey="id"
    [tableStyle]="'table-layout: fixed'">
        <ng-template pTemplate="header">
            <tr>
                <th class="w-16 !bg-slate-50 align-baseline">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th class="!bg-slate-50 whitespace-nowrap !py-2">
                    <button pRipple *ngIf="readUnreadBtn" (click)="markAs()" class="toolbar-btn mr-4">
                        <i class="material-symbols-outlined !text-[1.25rem] align-bottom mr-[1px]">drafts</i>
                        Read / Unread
                    </button>
                    <button pRipple *ngIf="moveToTrashBtn" (click)="moveEmailsToTrash()" class="toolbar-btn mr-4">
                        <i class="pi pi-trash align-text-top mr-[1px]"></i>
                        Move To Trash
                    </button>
                    <button pRipple *ngIf="restoreBtn" (click)="restoreEmails()" class="toolbar-btn mr-4">
                        <i class="pi pi-undo align-text-top mr-[1px]"></i>
                        Restore
                    </button>
                    <button pRipple *ngIf="deleteBtn" (click)="deleteEmails()" class="toolbar-btn mr-4">
                        <i class="pi pi-trash align-text-top mr-[1px]"></i>
                        Delete
                    </button>
                    <button pRipple *ngIf="addToFolderBtn" class="toolbar-btn">
                        <i class="material-symbols-outlined !text-[1.375rem] align-bottom mr-[1px]">drive_file_move</i>
                        Add To Folder
                    </button>
                </th>
                <th class="!bg-slate-50"></th>
                <th class="w-52 !bg-slate-50"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-email let-i="rowIndex">
            <tr (click)="folder ==='drafts' ? editDraft(i) : viewEmail(i)"
            class="row !text-slate-900 !text-opacity-90" [ngClass]="{ 'font-semibold': boldUnreadEmails && !email.read }">
                <td>
                    <p-tableCheckbox [value]="email" (click)="$event.stopPropagation()"></p-tableCheckbox>
                </td>
                <td>{{ email[col1] }}</td>
                <td>{{ email.subject }}</td>
                <td>{{ formatDate(email.date) }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<div class="flex items-center h-full bg-slate-900 shadow-v shadow-black">
  <div class="w-1/6">
    <div class="w-14 flex justify-center">
      <button (click)="toggleNavbar()" class="p-3 hover:bg-slate-800 text-xl rounded-2xl text-slate-100">
        <i class="pi pi-bars text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Search Bar -->
   <div class="w-4/6 flex justify-center items-center">
     <button class="relative left-8 hover:bg-slate-200 rounded-lg p-1">
       <i class="pi pi-search text-slate-900 text-opacity-95"></i>
     </button>
     <input type="text" placeholder="Search..." class="px-10 py-2 w-3/5 rounded-lg text-slate-900 bg-slate-50" />
     <button class="relative right-8 hover:bg-slate-200 rounded-lg p-1">
       <i class="pi pi-filter text-slate-900 text-opacity-95"></i>
     </button>
   </div>

  <div class="w-1/6 flex justify-end">
    <button class="text-slate-900 text-opacity-95 text-lg bg-slate-50 hover:bg-slate-200 py-2 px-3 rounded-lg mr-6" routerLink="/login">Log out</button>
  </div>
</div>

<div class="gradient flex justify-center items-center w-full h-full text-white">
  <p-toast position="top-center"></p-toast>
  <div class="glass w-2/5">
    <div class="h-16">
      <button class="border-b border-r nav-btn text-white/70" routerLink="/login">
        Log in
      </button>
      <button class="border-b nav-btn">Sign up</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="signup()">
      <div class="flex flex-col items-center">
        <div class="w-full flex justify-center items-center mt-[7%] relative">
          <span class="absolute left-[12.5%]">
            <i class="pi pi-user"></i>
          </span>
          <input type="text" placeholder="Email" class="w-4/5" formControlName="email" />
        </div>

        <div class="w-full flex justify-center items-center mt-[7%] relative">
          <span class="absolute left-[12.5%]">
            <i class="pi pi-lock"></i>
          </span>
          <input type="password" placeholder="Password" class="w-4/5"
            formControlName="password" />
        </div>

        <div *ngIf="minLength" class="text-red-600 -mb-4 mt-1 text-sm" >
          <i class="pi pi-exclamation-circle text-sm top-px"></i>
          Password must be at least 8 characters long
        </div>

        <div class="w-full flex justify-center items-center mt-[7%] relative">
          <span class="absolute left-[12.5%]">
            <i class="pi pi-lock"></i>
          </span>
          <input formControlName="confirmPassword" type="password" placeholder="Confirm Password" class="w-4/5" />
        </div>

        <div *ngIf="passwordMismatch" class="text-red-600 -mb-4 mt-1 text-sm" >
          <i class="pi pi-exclamation-circle text-sm top-px"></i>
          Passwords do not match
        </div>

        <button type="submit" class="submit-btn mt-[7%] mb-[10%]" [disabled]="form.invalid">
          Sign up
        </button>
      </div>
    </form>
  </div>
</div>

<div class="gradient flex justify-center items-center w-full h-full text-white border-r">
  <p-toast position="top-center"></p-toast>
  <div class="glass w-2/5">
    <div class="h-16">
      <button class="border-b border-r nav-btn">Log in</button>
      <button class="border-b nav-btn text-white/70" routerLink="/signup">
        Sign up
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="flex flex-col items-center">
        <div class="w-full flex justify-center items-center mt-[7%] relative">
          <span class="absolute left-[12.5%]">
            <i class="pi pi-user"></i>
          </span>
          <input type="text" placeholder="Email" class="w-4/5" formControlName="email" />
        </div>

        <div class="w-full flex justify-center items-center mt-[7%] relative">
          <span class="absolute left-[12.5%]">
            <i class="pi pi-lock"></i>
          </span>
          <input formControlName="password" [type]="passwordHidden ? 'password' : 'text'" placeholder="Password"
            class="w-4/5" />

          <button type="button" (mousedown)="passwordHidden = false" (mouseup)="passwordHidden = true" class="absolute right-[12.5%]">
            <i [class]="passwordHidden ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
          </button>
        </div>

        <button type="submit" class="submit-btn mt-[7%] mb-[10%]" [disabled]="form.invalid">Log in</button>
      </div>
    </form>
  </div>
</div>
